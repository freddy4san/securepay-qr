{% extends "base.html" %}
{% block content %}
  <section class="page-title">
    <p class="eyebrow">Merchant mode</p>
    <h1>Generate a signed QR</h1>
  </section>

  <form class="panel" method="post">
    <label for="merchant_id">Merchant</label>
    <select id="merchant_id" name="merchant_id">
      {% for merchant_id, merchant in merchants.items() %}
        <option value="{{ merchant_id }}" {% if merchant_id == selected_merchant %}selected{% endif %}>
          {{ merchant.name }}
        </option>
      {% endfor %}
    </select>

    <label for="amount">Amount</label>
    <input id="amount" name="amount" type="number" min="0.01" step="0.01" value="{{ amount }}" required>

    <label for="invoice_id">Invoice ID</label>
    <input id="invoice_id" name="invoice_id" value="{{ invoice_id }}" required>

    <button type="submit">Generate QR</button>
  </form>

  {% if token %}
    <section class="qr-card">
      <img class="qr-image" src="{{ qr_image }}" alt="SecurePay QR code for {{ payload.invoice_id }}">
      <h2>{{ payload.merchant_name }}</h2>
      <p>${{ "%.2f"|format(payload.amount) }} invoice {{ payload.invoice_id }}</p>
      <p>Expires in {{ ttl }} seconds</p>
    </section>

    <section class="panel compact">
      <label for="signed-token">Signed QR JSON</label>
      <textarea id="signed-token" rows="6" readonly>{{ token }}</textarea>
    </section>

    <form class="panel compact" method="post" action="{{ url_for('validate') }}">
      <input type="hidden" name="token" value="{{ token }}">
      <button type="submit">Scan valid QR</button>
    </form>

    <form class="panel compact danger-zone" method="post" action="{{ url_for('validate') }}">
      <input type="hidden" name="token" value="{{ tampered }}">
      <button type="submit">Scan tampered QR</button>
    </form>
  {% endif %}
{% endblock %}
